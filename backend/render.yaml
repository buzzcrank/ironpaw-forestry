services:
  - type: web
    name: ironpaw-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ironpaw-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://ironpawforestry.com
      - key: OPENAI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_CHUCK_VOICE_ID
        sync: false
      - key: ELEVENLABS_SCOUT_VOICE_ID
        sync: false
      - key: BASE_URL
        sync: false

databases:
  - name: ironpaw-db
    region: oregon
    plan: free
    databaseName: ironpaw
    user: ironpaw
